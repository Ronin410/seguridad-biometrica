services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: staffattendance
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - staffattendance_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./StaffAttendanceBack
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8100
      DATABASE_URL: postgres://postgres:postgres@db:5432/staffattendance?sslmode=disable
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-cambia-esta-clave-por-una-segura}
      TZ_NEGOCIO: ${TZ_NEGOCIO:-America/Mazatlan}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-95}
    ports:
      - "8100:8100"
    restart: unless-stopped

  frontend:
    build: ./StaffAttendanceFront
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8100
    ports:
      - "5174:5174"
    restart: unless-stopped

volumes:
  staffattendance_db:
